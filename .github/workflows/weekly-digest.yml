name: weekly-arxiv-digest

on:
  schedule:
    # 每周日 00:00 UTC（北京时间 08:00）自动抓取 arXiv 新论文
    - cron: '0 0 * * 0'
  workflow_dispatch: {}   # 也支持在 Actions 页面手动触发

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 30        # 防止 arXiv 限流导致任务长时间挂起
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      # 脚本内置安全阀：抓取异常时以非 0 退出且不覆盖已有 digest。
      # --fetch-retries 2：arXiv 若在限流，快速失败并自动切到 OpenAlex 备用源，
      # 避免长时间挂在 arXiv 上耗尽任务超时。
      - name: Fetch digest (arXiv → OpenAlex 备用源)
        id: fetch
        continue-on-error: true
        run: python3 scripts/fetch_arxiv.py --days 7 --max-results 30 --fetch-retries 2

      # 两条通道都失败时，冷却后直接走 OpenAlex 兜底
      - name: Retry after cooldown (直接用 OpenAlex 备用源)
        id: retry
        if: steps.fetch.outcome == 'failure'
        run: |
          echo "首次抓取失败（arXiv 限流且备用源未成功），冷却 5 分钟后直接用 OpenAlex 重试 ..."
          sleep 300
          python3 scripts/fetch_arxiv.py --days 7 --max-results 30 --source openalex

      - name: Fail visibly if both attempts failed
        if: steps.fetch.outcome == 'failure' && steps.retry.outcome == 'failure'
        run: |
          echo "::error::两次抓取均失败，已保留上一期内容，未做任何提交。请稍后在 Actions 页面手动重跑。"
          exit 1

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "本期无新增论文，无需提交。"
          else
            git commit -m "docs(papers): weekly arXiv digest $(date -u +%Y-%m-%d)"
            git push
          fi
