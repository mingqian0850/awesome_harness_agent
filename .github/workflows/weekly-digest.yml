name: weekly-arxiv-digest

on:
  schedule:
    # 每周日 00:00 UTC（北京时间 08:00）自动抓取 arXiv 新论文
    - cron: '0 0 * * 0'
  workflow_dispatch: {}   # 也支持在 Actions 页面手动触发

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Fetch arXiv digest
        run: python3 scripts/fetch_arxiv.py --days 7 --max-results 30

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "本期无新增论文，无需提交。"
          else
            git commit -m "docs(papers): weekly arXiv digest $(date -u +%Y-%m-%d)"
            git push
          fi
